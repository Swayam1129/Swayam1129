
# It draws a snake eating your contribution graph and refreshes it once a day.
name: Generate contribution snake

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0f3b2e&color_dots=#ebedf0,#b8f2de,#7eeac4,#4fe3b2,#1f9e75
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4fe3b2&color_dots=#161b22,#0f3b2e,#1f6e55,#35b98d,#4fe3b2

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
